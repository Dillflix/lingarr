name: Apply blind validator patch

on:
  push:
    branches:
      - fix/blind-source-unit-validator
    paths:
      - scripts/apply_blind_validator_patch.py
      - .github/workflows/apply-blind-validator-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/blind-source-unit-validator
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply_blind_validator_patch.py
      - name: Remove one-time patch machinery
        run: |
          rm scripts/apply_blind_validator_patch.py
          rm .github/workflows/apply-blind-validator-patch.yml
      - name: Commit patched implementation
        run: |
          git config user.name "Dillflix"
          git config user.email "116417856+Dillflix@users.noreply.github.com"
          git add -A
          git commit -m "Blind validator candidate origins"
          git push origin HEAD:fix/blind-source-unit-validator
