name: Apply source-unit benchmark integration

on:
  push:
    branches:
      - feature/source-unit-benchmark

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/source-unit-benchmark
          fetch-depth: 0
      - name: Patch backend integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Register the source detector and benchmark as first-class scoped services.
          p = Path('Lingarr.Server/Extensions/ServiceCollectionExtensions.cs')
          s = p.read_text(encoding='utf-8-sig')
          old = '        builder.Services.AddScoped<ITranslationUnitResegmentationService, TranslationUnitResegmentationService>();\n'
          new = old + '        builder.Services.AddScoped<ISourceUnitDetectionService, SourceUnitDetectionService>();\n        builder.Services.AddScoped<ISourceUnitBenchmarkService, SourceUnitBenchmarkService>();\n'
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8-sig')

          # Use the registered source detector/benchmark in TranslationJob instead of constructing a private detector.
          p = Path('Lingarr.Server/Jobs/TranslationJob.cs')
          s = p.read_text(encoding='utf-8-sig')
          s = s.replace(
              '    private readonly ILogger<SourceUnitDetectionService> _sourceUnitDetectionLogger;\n',
              '    private readonly ISourceUnitDetectionService _sourceUnitDetectionService;\n    private readonly ISourceUnitBenchmarkService _sourceUnitBenchmarkService;\n',
              1)
          s = s.replace(
              '        ILogger<ResegmentationBenchmarkService> benchmarkLogger,\n        ILogger<SourceUnitDetectionService> sourceUnitDetectionLogger,\n        ISettingService settings,\n',
              '        ILogger<ResegmentationBenchmarkService> benchmarkLogger,\n        ISourceUnitDetectionService sourceUnitDetectionService,\n        ISourceUnitBenchmarkService sourceUnitBenchmarkService,\n        ISettingService settings,\n',
              1)
          s = s.replace(
              '        _benchmarkLogger = benchmarkLogger;\n        _sourceUnitDetectionLogger = sourceUnitDetectionLogger;\n        _settings = settings;\n',
              '        _benchmarkLogger = benchmarkLogger;\n        _sourceUnitDetectionService = sourceUnitDetectionService;\n        _sourceUnitBenchmarkService = sourceUnitBenchmarkService;\n        _settings = settings;\n',
              1)
          old_block = '''                var sourceUnitDetectionService = new SourceUnitDetectionService(
                    _settings,
                    _httpClientFactory,
                    _sourceUnitDetectionLogger);

                var sentenceAwareTranslator = new SentenceAwareTranslationUnitService(
                    translator,
                    _progressService,
                    _logger,
                    _resegmentationService,
                    benchmarkService,
                    sourceUnitDetectionService);
'''
          new_block = '''                var sentenceAwareTranslator = new SentenceAwareTranslationUnitService(
                    translator,
                    _progressService,
                    _logger,
                    _resegmentationService,
                    benchmarkService,
                    _sourceUnitDetectionService,
                    _sourceUnitBenchmarkService);
'''
          assert old_block in s
          s = s.replace(old_block, new_block, 1)
          p.write_text(s, encoding='utf-8-sig')

          # Capture the exact source candidate window and production boundary decision before MiLMMT.
          p = Path('Lingarr.Server/Services/Translation/SentenceAwareTranslationUnitService.cs')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '    private readonly ISourceUnitDetectionService? _sourceUnitDetectionService;\n',
              '    private readonly ISourceUnitDetectionService? _sourceUnitDetectionService;\n    private readonly ISourceUnitBenchmarkService? _sourceUnitBenchmarkService;\n',
              1)
          s = s.replace(
              '        IResegmentationBenchmarkService? benchmarkService = null,\n        ISourceUnitDetectionService? sourceUnitDetectionService = null)\n',
              '        IResegmentationBenchmarkService? benchmarkService = null,\n        ISourceUnitDetectionService? sourceUnitDetectionService = null,\n        ISourceUnitBenchmarkService? sourceUnitBenchmarkService = null)\n',
              1)
          s = s.replace(
              '        _benchmarkService = benchmarkService;\n        _sourceUnitDetectionService = sourceUnitDetectionService;\n',
              '        _benchmarkService = benchmarkService;\n        _sourceUnitDetectionService = sourceUnitDetectionService;\n        _sourceUnitBenchmarkService = sourceUnitBenchmarkService;\n',
              1)
          s = s.replace(
              '            var unit = await BuildTranslationUnitAsync(\n                logicalCues,\n                cueIndex,\n                translationRequest.SourceLanguage,\n                cancellationToken);\n',
              '            var unit = await BuildTranslationUnitAsync(\n                logicalCues,\n                cueIndex,\n                translationRequest,\n                cancellationToken);\n',
              1)

          start = s.index('    private async Task<List<LogicalSubtitleCue>> BuildTranslationUnitAsync(')
          end = s.index('    /// <summary>\n    /// Builds the maximum safe candidate prefix', start)
          method = '''    private async Task<List<LogicalSubtitleCue>> BuildTranslationUnitAsync(
        IReadOnlyList<LogicalSubtitleCue> cues,
        int startIndex,
        TranslationRequest translationRequest,
        CancellationToken cancellationToken)
    {
        var candidates = BuildCandidateWindow(cues, startIndex);
        if (candidates.Count <= 1)
        {
            return candidates;
        }

        var detectorCues = candidates.Select(ToDetectionCue).ToList();
        SourceUnitDetectionResult detection;

        if (_sourceUnitDetectionService is null)
        {
            var heuristicLength = SourceUnitDetectionService.DetermineHeuristicUnitLength(detectorCues);
            var heuristic = new SourceUnitDetectionCandidate
            {
                Method = SourceUnitDetectionModes.Heuristic,
                UnitLength = heuristicLength,
                IsValid = true,
                LatencyMs = 0
            };
            detection = new SourceUnitDetectionResult
            {
                Mode = SourceUnitDetectionModes.Heuristic,
                SelectedMethod = SourceUnitDetectionModes.Heuristic,
                UnitLength = heuristicLength,
                Heuristic = heuristic
            };
        }
        else
        {
            detection = await _sourceUnitDetectionService.DetectAsync(
                new SourceUnitDetectionRequest
                {
                    SourceLanguage = translationRequest.SourceLanguage,
                    Cues = detectorCues
                },
                cancellationToken);
        }

        var unitLength = Math.Clamp(detection.UnitLength, 1, candidates.Count);
        _logger.LogDebug(
            "Source-unit detection at cue {Position} selected {UnitLength} of {CandidateCount} cue(s) using {Method} ({Mode}).",
            candidates[0].Representative.Position,
            unitLength,
            candidates.Count,
            detection.SelectedMethod,
            detection.Mode);

        if (_sourceUnitBenchmarkService is not null)
        {
            try
            {
                await _sourceUnitBenchmarkService.CaptureAsync(
                    new SourceUnitBenchmarkCaptureRequest
                    {
                        SourceLanguage = translationRequest.SourceLanguage,
                        Cues = detectorCues,
                        Detection = detection,
                        TranslationRequestId = translationRequest.Id,
                        StartPosition = candidates[0].Representative.Position,
                        EndPosition = candidates[^1].Representative.Position
                    },
                    cancellationToken);
            }
            catch (OperationCanceledException) when (cancellationToken.IsCancellationRequested)
            {
                throw;
            }
            catch (Exception ex)
            {
                _logger.LogWarning(
                    ex,
                    "Failed to capture source-unit benchmark window beginning at cue {Position}; translation will continue.",
                    candidates[0].Representative.Position);
            }
        }

        return candidates.Take(unitLength).ToList();
    }

'''
          s = s[:start] + method + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/apply-source-unit-benchmark-integration.yml
      - name: Commit integration
        shell: bash
        run: |
          git config user.name Dillflix
          git config user.email 116417856+Dillflix@users.noreply.github.com
          git add Lingarr.Server .github/workflows/apply-source-unit-benchmark-integration.yml
          git commit -m "Integrate source-unit benchmark capture"
          git push origin HEAD:feature/source-unit-benchmark
