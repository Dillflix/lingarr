name: Fix blind validator newline literals

on:
  push:
    branches:
      - fix/blind-source-unit-validator

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/blind-source-unit-validator
      - name: Fix malformed newline string literals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('Lingarr.Server/Services/Translation/SourceUnitDetectionService.cs'),
              Path('Lingarr.Server/Services/Translation/TranslationUnitResegmentationService.cs'),
          ]
          broken = 'string.Join("\n",'
          fixed = 'string.Join("\\n",'
          for path in paths:
              text = path.read_text(encoding='utf-8-sig')
              if broken not in text:
                  raise SystemExit(f'Expected malformed literal not found in {path}')
              path.write_text(text.replace(broken, fixed), encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/fix-blind-validator-newline.yml
      - name: Commit fix
        run: |
          git config user.name "Dillflix"
          git config user.email "116417856+Dillflix@users.noreply.github.com"
          git add Lingarr.Server/Services/Translation/SourceUnitDetectionService.cs \
                  Lingarr.Server/Services/Translation/TranslationUnitResegmentationService.cs \
                  .github/workflows/fix-blind-validator-newline.yml
          git commit -m "Fix blind validator newline literals"
          git push origin HEAD:fix/blind-source-unit-validator
